[package]
name = "lau-quantum-topology-agents"
version = "0.1.0"
edition = "2021"
description = "Quantum topology (TQFT) applied to agent systems — Frobenius algebras, cobordisms, anyons, knot invariants, and topologically protected communication"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-quantum-topology-agents"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

